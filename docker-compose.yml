name: crystal-ball
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cb_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: crystal_ball
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d crystal_ball"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongo:27017\"}]}).ok }' | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  minio:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes: [minio_data:/data]
    networks: [internal]

  minio-init:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    restart: "no"
    depends_on:
      minio: { condition: service_started }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 3; done
        mc mb --ignore-existing local/$$S3_BUCKET
        cat > /tmp/cb-app-policy.json <<EOF
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::$$S3_BUCKET"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:PutObjectTagging"],"Resource":["arn:aws:s3:::$$S3_BUCKET/*"]}]}
        EOF
        if ! mc admin policy info local crystal-ball-app >/dev/null 2>&1; then mc admin policy create local crystal-ball-app /tmp/cb-app-policy.json; fi
        if ! mc admin user info local "$$S3_ACCESS_KEY" >/dev/null 2>&1; then mc admin user add local "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; fi
        mc admin policy attach local crystal-ball-app --user "$$S3_ACCESS_KEY"
    networks: [internal]

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes: [clamav_data:/var/lib/clamav]
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 180s
    networks: [internal]

  migrate:
    build: ./backend
    restart: "no"
    env_file: ./backend/.env
    environment:
      OWNER_DATABASE_URL: postgresql://${POSTGRES_USER:-cb_owner}:${POSTGRES_PASSWORD_URL}@postgres:5432/crystal_ball?schema=public
      DATABASE_URL: postgresql://cb_app:${APP_DB_PASSWORD_URL:?Set APP_DB_PASSWORD_URL in .env}@postgres:5432/crystal_ball?schema=public
      APP_DB_PASSWORD: ${APP_DB_PASSWORD_URL}
      MONGODB_URI: mongodb://mongo:27017/crystal_ball?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    command: ["sh", "scripts/migrate-deploy.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY: "true"
      DATABASE_URL: postgresql://cb_app:${APP_DB_PASSWORD_URL}@postgres:5432/crystal_ball?schema=public
      MONGODB_URI: mongodb://mongo:27017/crystal_ball?replicaSet=rs0
      MONGO_CHANGE_STREAMS_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      clamav: { condition: service_healthy }
    ports: ["127.0.0.1:${API_PORT:-4000}:4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [internal]

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://cb_app:${APP_DB_PASSWORD_URL}@postgres:5432/crystal_ball?schema=public
      MONGODB_URI: mongodb://mongo:27017/crystal_ball?replicaSet=rs0
      MONGO_CHANGE_STREAMS_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    command: ["node", "dist/src/workers/start.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      args: { API_URL: http://api:4000 }
    restart: unless-stopped
    environment: { NODE_ENV: production }
    depends_on:
      api: { condition: service_healthy }
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    networks: [internal]

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./ops/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus_data:/prometheus
    depends_on: { api: { condition: service_healthy } }
    ports: ["127.0.0.1:9090:9090"]
    networks: [internal]

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    ports: ["127.0.0.1:3001:3000"]
    networks: [internal]

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  minio_data:
  clamav_data:
  prometheus_data:
  grafana_data:
networks:
  internal:
    driver: bridge
